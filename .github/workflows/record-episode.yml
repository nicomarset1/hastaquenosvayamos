name: Grabar y publicar programa

on:
  schedule:
    # GitHub puede demorar un cron programado varias horas (nos paso: un
    # disparo pensado para las 11:10 ART arranco a las 15:42 ART y grabo
    # medio programa de otra franja horaria). Para tolerar eso, disparamos
    # cada 5 min durante toda la ventana real del programa (11:05 a 12:15
    # ART = 14:05 a 15:15 UTC); el primer disparo que caiga dentro de la
    # ventana graba, y "Verificar ventana de grabacion" descarta el resto.
    - cron: '5-55/5 14 * * 1'
    - cron: '0-15/5 15 * * 1'
  workflow_dispatch:
    inputs:
      duracion_segundos:
        description: 'Duración de la grabación en segundos (dejar vacío = 67 min reales; usar un valor chico, ej. 30, para probar el flujo completo sin esperar)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: record-episode
  cancel-in-progress: false

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Verificar ventana de grabacion
        id: ventana
        if: github.event_name == 'schedule'
        run: node scripts/check-recording-window.mjs >> "$GITHUB_OUTPUT"

      - name: Grabar el streaming en vivo
        id: grabar
        if: github.event_name != 'schedule' || steps.ventana.outputs.grabar == 'true'
        run: |
          DURACION="${{ github.event.inputs.duracion_segundos }}"
          if [ -z "$DURACION" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              DURACION="${{ steps.ventana.outputs.duracion }}"
            else
              DURACION=4020
            fi
          fi
          FECHA=$(TZ="America/Argentina/Buenos_Aires" date +%Y-%m-%d)
          ARCHIVO="/tmp/${FECHA}.mp3"
          ffmpeg -y -i "http://173.255.205.241:7278/?type=https" -t "$DURACION" -c copy "$ARCHIVO"
          TAMANO=$(stat -c%s "$ARCHIVO")
          echo "archivo=$ARCHIVO" >> "$GITHUB_OUTPUT"
          if [ "$TAMANO" -lt 512000 ]; then
            echo "valido=false" >> "$GITHUB_OUTPUT"
            echo "Grabación muy chica ($TAMANO bytes) — probablemente no hubo transmisión. No se publica."
          else
            echo "valido=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependencia de Vercel Blob
        if: steps.grabar.outputs.valido == 'true'
        run: npm install @vercel/blob --no-save

      - name: Subir el audio a Vercel Blob
        id: subir
        if: steps.grabar.outputs.valido == 'true'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          URL=$(node scripts/upload-blob.mjs "${{ steps.grabar.outputs.archivo }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Armar la entrada del episodio
        if: steps.grabar.outputs.valido == 'true'
        run: node scripts/publish-episode.mjs "${{ steps.subir.outputs.url }}"

      - name: Commit y push si hay algo nuevo
        if: steps.grabar.outputs.valido == 'true'
        run: |
          git config user.name "hnv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes.json
          if git diff --cached --quiet; then
            echo "Nada para publicar."
            exit 0
          fi
          git commit -m "Programa del $(TZ='America/Argentina/Buenos_Aires' date +%d-%m-%Y) [auto]"
          git push
