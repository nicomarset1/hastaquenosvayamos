name: Migrar audios a Vercel Blob

# Uso unico (o cada vez que quede un mp3 commiteado a mano en /episodios):
# GitHub -> Actions -> "Migrar audios a Vercel Blob" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install @vercel/blob --no-save

      - name: Migrar archivos locales a Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/migrate-to-blob.mjs

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "hnv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada para migrar."
            exit 0
          fi
          git commit -m "Migrar audios locales a Vercel Blob [auto]"
          git push
